name: Simulacao 5G NR / UWOC

# ATENCAO: o repo github.com/esantos-798/UFES tem raiz em C:\UFES e versiona
# varios projetos de mestrado. O GitHub so reconhece workflows em .github/ na
# RAIZ do repo -- daqui os 'paths' limitam o disparo ao projeto de telecom.
# Octave headless com backend 'custom': roda sem 5G Toolbox em runner gratuito.

on:
  push:
    branches: [main]
    paths:
      - 'Mestrado/Segundo_Semestre/Topicos_Especiais_em_Telecom_e_Tecnologia_da_Info_X/**'
      - '.github/workflows/simulacao-uwoc.yml'
  pull_request:
    paths:
      - 'Mestrado/Segundo_Semestre/Topicos_Especiais_em_Telecom_e_Tecnologia_da_Info_X/**'
      - '.github/workflows/simulacao-uwoc.yml'
  workflow_dispatch:
    inputs:
      save_baseline:
        description: 'Regenera baseline.csv (use quando mudar a fisica de proposito)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJ: Mestrado/Segundo_Semestre/Topicos_Especiais_em_Telecom_e_Tecnologia_da_Info_X

jobs:
  regressao:
    name: Regressao numerica do downlink
    runs-on: ubuntu-latest
    container:
      # Mesma versao do Octave instalado localmente (11.3.0): o runner e a sua
      # maquina produzem os mesmos numeros, entao um verde local vale no CI.
      # Imagem mantida pelo projeto GNU Octave (hub.docker.com/r/gnuoctave/octave),
      # nao e uma imagem oficial do Docker Hub -- vale revisar antes de confiar.
      # Evitado 'apt-get install octave' no runner: arrasta a stack TeX Live e o
      # install morria sem mensagem aproveitavel (exit 100, depois exit 1).
      image: gnuoctave/octave:11.3.0
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Ambiente do container (diagnostico publico)
        # Toda saida relevante vai tambem para GITHUB_STEP_SUMMARY: e a unica
        # superficie deste job legivel sem autenticacao (log e artefato exigem login).
        run: |
          SUM="$GITHUB_STEP_SUMMARY"
          say() { echo "$1"; echo "$1" >> "$SUM"; }
          fail() { echo >> "$SUM"; say "::error:: $1"; exit 1; }

          echo '```' > "$SUM"
          say "user=$(id -un) uid=$(id -u) home=$HOME"
          grep '^PRETTY_NAME' /etc/os-release 2>/dev/null || true
          echo "PATH=$PATH"

          say "--- candidatos a binario octave ---"
          command -v octave     || say "  octave: fora do PATH"
          command -v octave-cli || say "  octave-cli: fora do PATH"
          ls /usr/bin /usr/local/bin 2>/dev/null | grep -i octave || say "  nenhum arquivo *octave* nos dirs padrao"

          OB="$(command -v octave 2>/dev/null || command -v octave-cli 2>/dev/null || true)"
          [ -n "$OB" ] || fail "nenhum binario octave/octave-cli no container"
          echo "octave=$OB" >> "$GITHUB_ENV"
          say "binario escolhido: $OB"

          "$OB" --version 2>&1 | head -3 || fail "--version falhou, imagem aparentemente quebrada"

          say "--- ferramentas de build (pkg -forge exige gcc/gfortran/make) ---"
          for t in gcc g++ gfortran make; do
            say "  $t: $(command -v $t || echo AUSENTE)"
          done

          say "--- pacotes Octave na imagem ---"
          "$OB" -q --eval "c=pkg('list'); for k=1:numel(c), printf('%s=%s ', c{k}.name, c{k}.version); end; puts('');" 2>&1 | head -5

          say "--- resample: dependencia real da suite ---"
          if "$OB" -q --eval "pkg('load','signal'); if exist('resample')==0, exit(1); end" 2>&1; then
            say "  OK: signal carrega e resample existe"
          else
            say "  AUSENTE: signal nao fornece resample"
            say '```' >> "$SUM"
            fail "signal ausente no container gnuoctave/octave:11.3.0"
          fi
          echo '```' >> "$SUM"

      - name: Diagnostico do ambiente
        working-directory: ${{ env.PROJ }}
        run: |
          "$octave" -q --eval "addpath('ci'); ci_doctor();"

      - name: Suite de regressao do downlink
        working-directory: ${{ env.PROJ }}
        run: |
          "$octave" -q --eval "addpath('ci'); ok = run_downlink_tests(); exit(~ok)"

      - name: Valizacao DUC/DDC (skip fora do MATLAB)
        working-directory: ${{ env.PROJ }}
        run: |
          "$octave" -q --eval "addpath('ci'); ok = validate_moddemod(); exit(~ok)"

      - name: Regenerar baseline se pedido
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.save_baseline }}
        working-directory: ${{ env.PROJ }}
        env:
          UWOC_SAVE_BASELINE: '1'
        run: |
          "$octave" -q --eval "addpath('ci'); ok = run_downlink_tests(); exit(~ok)"

      - name: Publicar baseline e metricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricas-downlink
          path: |
            ${{ env.PROJ }}/ci/baseline.csv
            ${{ env.PROJ }}/ci/results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Tabela no resumo do run
        if: always()
        working-directory: ${{ env.PROJ }}
        run: |
          {
            echo "## Downlink 5G NR / UWOC"
            echo
            if [ -f ci/results/summary.md ]; then
              cat ci/results/summary.md
            else
              echo "_suite nao escreveu resumo (falhou antes da comparacao)_"
            fi
            echo
            echo "---"
            echo "_job na imagem gnuoctave/octave:11.3.0, mesma versao do Octave local_"
          } >> "$GITHUB_STEP_SUMMARY"
