name: Simulacao 5G NR / UWOC

# ATENCAO: o repo github.com/esantos-798/UFES tem raiz em C:\UFES e versiona
# varios projetos de mestrado. O GitHub so reconhece workflows em .github/ na
# RAIZ do repo -- daqui os 'paths' limitam o disparo ao projeto de telecom.
# Octave headless com backend 'custom': roda sem 5G Toolbox em runner gratuito.

on:
  push:
    branches: [main]
    paths:
      - 'Mestrado/Segundo_Semestre/Topicos_Especiais_em_Telecom_e_Tecnologia_da_Info_X/**'
      - '.github/workflows/simulacao-uwoc.yml'
  pull_request:
    paths:
      - 'Mestrado/Segundo_Semestre/Topicos_Especiais_em_Telecom_e_Tecnologia_da_Info_X/**'
      - '.github/workflows/simulacao-uwoc.yml'
  workflow_dispatch:
    inputs:
      save_baseline:
        description: 'Regenera baseline.csv (use quando mudar a fisica de proposito)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJ: Mestrado/Segundo_Semestre/Topicos_Especiais_em_Telecom_e_Tecnologia_da_Info_X

jobs:
  regressao:
    name: Regressao numerica do downlink
    runs-on: ubuntu-latest
    env:
      # O container roda como root e o workspace pertence ao usuario 'runner' do
      # host; sem isto o git do passo 'Post Run actions/checkout' morre com exit 128
      # (detected dubious ownership). Config por variavel de ambiente vale para os
      # proprios actions, sem tocar em arquivo de config nenhum.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    container:
      # Mesma versao do Octave instalado localmente (11.3.0): o runner e a sua
      # maquina produzem os mesmos numeros, entao um verde local vale no CI.
      # Imagem mantida pelo projeto GNU Octave (hub.docker.com/r/gnuoctave/octave),
      # nao e uma imagem oficial do Docker Hub -- vale revisar antes de confiar.
      # Evitado 'apt-get install octave' no runner: arrasta a stack TeX Live e o
      # install morria sem mensagem aproveitavel (exit 100, depois exit 1).
      image: gnuoctave/octave:11.3.0
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepara o Octave do container (instala signal se faltar)
        # Diagnostico por ::warning::/::error::: annotation e a UNICA superficie
        # deste job legivel sem login (log cru, artefato e ate o step summary
        # exigem autenticacao -- confirmado no run #5).
        # A imagem gnuoctave/octave compila o Octave do fonte com toolchain
        # completo, mas nao traz NENHUM pacote Forge. 'signal' e dependencia real
        # da suite (resample/filtfilt), entao ele e instalado aqui.
        working-directory: ${{ env.PROJ }}
        run: |
          OB="$(command -v octave 2>/dev/null || command -v octave-cli 2>/dev/null || true)"
          if [ -z "$OB" ]; then
            echo "::error::nenhum binario octave/octave-cli no container"
            exit 1
          fi
          echo "octave=$OB" >> "$GITHUB_ENV"

          ann() { echo "::${1}::$(printf '%s' "$2" | tr '\n\r' '  ' | tr -d '%' | cut -c1-1000)"; }

          have_resample() {
            "$OB" -q --eval "addpath('ci'); load_signal_pkg(); if exist('resample') == 0, exit(1); end" >/dev/null 2>&1
          }

          # Roda o comando, mostra o log inteiro no passo e publica o rabicho como
          # annotation (e o unico pedaco do log que alguem sem login consegue ler).
          attempt() {
            label="$1"; shift
            out="$("$@" 2>&1)"; st=$?
            printf '%s\n' "$out"
            ann warning "$label exit=$st tail: $(printf '%s' "$out" | tail -22 | tr '\n\r' '  ')"
            return $st
          }

          echo "== $("$OB" --version 2>&1 | head -1) | uid=$(id -u) home=$HOME =="

          if have_resample; then
            echo "signal ja vinha na imagem: nada a instalar"
          else
            ann warning "signal ausente; toolchain: $(for t in gcc gfortran make mkoctfile curl tar; do printf '%s=%s ' "$t" "$(command -v $t || echo AUSENTE)"; done)"
            # O signal do Forge declara 'Depends: control >= 2.4' e o pkg recusa a
            # instalacao ANTES de compilar qualquer coisa (erro visto no run #6).
            # -nodeps e intencional: a suite so usa resample/filtfilt/kaiser (.m) e
            # upfirdn (.cc), nenhum toca no control. Localmente o control esta
            # instalado mas NAO carregado, entao o namespace do CI fica igual.
            if attempt "pkg-forge" "$OB" -q --eval "pkg('install', '-nodeps', '-forge', 'signal')" && have_resample; then
              echo "signal instalado pelo Forge"
            elif attempt "pkg-1.4.6" "$OB" -q --eval "pkg('install', '-nodeps', 'https://downloads.sourceforge.net/octave/signal-1.4.6.tar.gz')" && have_resample; then
              echo "signal instalado pelo tarball pinnado 1.4.6"
            else
              ann error "signal seguem ausente: as duas annotations pkg-forge/pkg-1.4.6 acima tem o erro real"
              exit 1
            fi
          fi

          FP="$("$OB" -q --eval "addpath('ci'); load_signal_pkg(); v = octave_pkg_version('signal'); printf('Octave %s | signal %s | resample: %s', version(), strjoin(cellstr(num2str(v(:))), '.'), which('resample'))" 2>&1 | tail -1)"
          ann notice "$FP"

      - name: Diagnostico do ambiente
        working-directory: ${{ env.PROJ }}
        run: |
          "$octave" -q --eval "addpath('ci'); ci_doctor();"

      - name: Suite de regressao do downlink
        working-directory: ${{ env.PROJ }}
        run: |
          # O veredito vira annotation: e a unica linha deste passo que quem nao
          # esta logado consegue ler, e assim o 'primeiro teste passando' fica
          # visivel no proprio run (o PASS completo so sai no log, protegido).
          if out="$("$octave" -q --eval "addpath('ci'); ok = run_downlink_tests(); exit(~ok)" 2>&1)"; then st=0; else st=$?; fi
          printf '%s\n' "$out"
          verdict=$(if [ $st -eq 0 ]; then echo PASS; else echo FAIL; fi)
          echo "::notice::suite $verdict (exit $st): $(printf '%s' "$out" | grep -E '^(PASS|FAIL|=)' | tr '\n\r' '  ' | tr -d '%' | cut -c1-600)"
          exit $st

      - name: Valizacao DUC/DDC (skip fora do MATLAB)
        working-directory: ${{ env.PROJ }}
        run: |
          "$octave" -q --eval "addpath('ci'); ok = validate_moddemod(); exit(~ok)"

      - name: Regenerar baseline se pedido
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.save_baseline }}
        working-directory: ${{ env.PROJ }}
        env:
          UWOC_SAVE_BASELINE: '1'
        run: |
          "$octave" -q --eval "addpath('ci'); ok = run_downlink_tests(); exit(~ok)"

      - name: Publicar baseline e metricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricas-downlink
          path: |
            ${{ env.PROJ }}/ci/baseline.csv
            ${{ env.PROJ }}/ci/results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Tabela no resumo do run
        if: always()
        working-directory: ${{ env.PROJ }}
        run: |
          {
            echo "## Downlink 5G NR / UWOC"
            echo
            if [ -f ci/results/summary.md ]; then
              cat ci/results/summary.md
            else
              echo "_suite nao escreveu resumo (falhou antes da comparacao)_"
            fi
            echo
            echo "---"
            echo "_job na imagem gnuoctave/octave:11.3.0, mesma versao do Octave local_"
          } >> "$GITHUB_STEP_SUMMARY"
